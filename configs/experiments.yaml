experiments:
  E1:
    model: srcnn
    scale: 2
    loss: mse
    train_set: Set5
    test_set: Set14
    device: local
  E2:
    model: srcnn
    scale: 4
    loss: mse
    train_set: Set5
    test_set: Set14
