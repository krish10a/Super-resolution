  batch_size_local_mse: 4
  batch_size_local_perceptual: 2
  batch_size_colab: 8
  grad_accum_steps: 4
  max_epochs: 200
  early_stop_patience: 15
  perceptual_lambda: 0.07
  patch_lr_2x: 32
  patch_lr_4x: 48
  num_threads: 8
